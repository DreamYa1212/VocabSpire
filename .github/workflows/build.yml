name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore VocabSpire/VocabSpire.csproj

    - name: Build
      run: dotnet build VocabSpire/VocabSpire.csproj -c Release --no-restore

    - name: Package zip
      shell: pwsh
      run: |
        $src = "VocabSpire/.godot/mono/temp/bin/Release"
        $dst = "publish/VocabSpire"
        New-Item -ItemType Directory -Path "$dst/wordbanks" -Force | Out-Null
        Copy-Item "$src/VocabSpire.dll"           $dst/
        Copy-Item "$src/VocabSpire.pdb"           $dst/
        Copy-Item "$src/VocabSpire.json"          $dst/
        Copy-Item "$src/VocabSpire.deps.json"     $dst/
        Copy-Item "$src/VocabSpire.runtimeconfig.json" $dst/
        Copy-Item "$src/GodotSharp.dll"           $dst/
        Copy-Item "$src/ZstdSharp.dll"            $dst/
        Copy-Item "VocabSpire/Resources/vocab_icon.png"     $dst/
        Copy-Item "VocabSpire/Resources/wordbanks/*.json" "$dst/wordbanks/"
        Copy-Item "VocabSpire/Resources/wordbanks/*.csv"  "$dst/wordbanks/"
        Compress-Archive -Path "$dst/*" -DestinationPath "publish/VocabSpire.zip"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: VocabSpire
        path: publish/VocabSpire.zip
