name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore VocabSpire/VocabSpire.csproj

    - name: Build
      run: dotnet build VocabSpire/VocabSpire.csproj -c Release --no-restore

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: VocabSpire
        path: VocabSpire/.godot/mono/temp/bin/Release/VocabSpire.dll
